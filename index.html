<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mark's Schedule</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
 body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;

    background-color: #0a0a0a;
    background-image: linear-gradient(
        180deg,
        #3b3b3b 0%,
        #222222 45%,
        #0a0a0a 100%
    );

    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;

    color: #e0e0e0;
    animation: antiIdle 2m infinite;
}
  @keyframes antiIdle {
    0%, 100% { opacity: 1 }
    50% { opacity: 0.999 }
  }
  h1 {
    text-align: center;
    margin: 24px 0 0;
    font-size: 2em;
    color: #e0e0e0;
  }
  #subtitle {
    text-align: center;
    font-size: 1em;
    margin-bottom: 20px;
    color: #aaa;
  }
  .schedule {
    max-width: 600px;
    margin: 0 auto 40px;
    border: 1px solid #444;
    border-radius: 8px;
    overflow: hidden;
  }
  .block {
    display: flex;
    align-items: center;
    padding: 0;
    transition: background-color 0.3s ease;
  }
  .num-col {
    width: 60px;
    text-align: center;
    font-size: 1.5em;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }
  .label-col {
    flex: 1;
    padding: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <h1>Mark's Schedule</h1>
  <div id="subtitle"></div>
  <div class="schedule" id="schedule"></div>

<script>
  const blocks = [
    { num: 1, label: "1st Period", start: "8:30 AM", end: "10:00 AM", silk: "#FF0100", numText: "#FFF" },
    { num: 2, label: "2nd Period", start: "10:00 AM", end: "10:30 AM", silk: "#FFFFFF", numText: "#000" },
    { num: 3, label: "3rd Period", start: "10:30 AM", end: "12:00 PM", silk: "#0000FF", numText: "#FFF" },
    { num: 4, label: "Lunch", start: "12:00 PM", end: "1:00 PM", silk: "#FFFF00", numText: "#000" },
    { num: 5, label: "5th Period", start: "1:00 PM", end: "2:30 PM", silk: "#008001", numText: "#FFF" },
    { num: 6, label: "6th Period", start: "2:30 PM", end: "3:00 PM", silk: "#000000", numText: "#FFD700" },
    { num: 7, label: "7th Period", start: "3:00 PM", end: "4:30 PM", silk: "#FF6601", numText: "#000" }
  ];

  function getCurrentTimeInSeconds() {
    const now = new Date();
    return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  }

  function timeToSeconds(timeStr) {
    const [time, meridian] = timeStr.split(" ");
    let [hours, minutes] = time.split(":").map(Number);
    if (meridian === "PM" && hours !== 12) hours += 12;
    if (meridian === "AM" && hours === 12) hours = 0;
    return hours * 3600 + minutes * 60;
  }

  function formatTimeLabel(timeStr) {
    const [time, meridianRaw] = timeStr.split(" ");
    return time + meridianRaw.toLowerCase();
  }

  function formatCountdown(secondsLeft) {
    const m = Math.floor(secondsLeft / 60);
    return `${m}m`;
  }

  function updateSubtitle() {
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' };
    document.getElementById("subtitle").textContent = now.toLocaleString('en-US', options);
  }

  function renderSchedule() {
    const container = document.getElementById("schedule");
    container.innerHTML = "";
    const now = getCurrentTimeInSeconds();

    blocks.forEach(block => {
      const start = timeToSeconds(block.start);
      const end = timeToSeconds(block.end);
      const isActive = now >= start && now < end;
      const secondsLeft = end - now;
      const totalSeconds = end - start;

      const countdown = formatCountdown(secondsLeft);

      const segmentSize = 900; // 15 minutes
      const totalSegments = Math.max(1, Math.floor(totalSeconds / segmentSize));
      const horseSegment = Math.min(totalSegments - 1, Math.floor(secondsLeft / segmentSize));

      let progressLine = "| ";
      for (let i = 0; i < totalSegments; i++) {
        progressLine += i === horseSegment ? "🏇" : "-";
        progressLine += " ";
      }
      progressLine += "|";

      const row = document.createElement("div");
      row.className = "block";
      if (isActive) {
        row.style.backgroundColor = block.silk;
        row.style.color = block.numText;
      }

      const numCol = document.createElement("div");
      numCol.className = "num-col";
      numCol.textContent = block.num;
      numCol.style.backgroundColor = block.silk;
      numCol.style.color = block.numText;

      const labelCol = document.createElement("div");
      labelCol.className = "label-col";
      labelCol.innerHTML = `
        <span>${formatTimeLabel(block.start)} - ${formatTimeLabel(block.end)} • ${block.label}</span>
        <span>${isActive ? `${countdown} ${progressLine}` : ""}</span>
      `;

      row.appendChild(numCol);
      row.appendChild(labelCol);
      container.appendChild(row);
    });
  }

  setInterval(() => {
    document.body.dataset.ping = Date.now();
  }, 120000);

  setInterval(renderSchedule, 1000);
  setInterval(updateSubtitle, 1000);
  renderSchedule();
  updateSubtitle();
</script>
</body>
</html>
